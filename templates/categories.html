{% extends 'master.html' %}

{% block title %}Categories | BlogWebsite{% endblock %}

{% block content %}
<h1>Categories</h1>
<ul class="category-list">
    {% for category in categories %}
    <li>{{ category.name }}</li>
    {% empty %}
    <li>No categories found.</li>
    {% endfor %}
</ul>
{% endblock %}
